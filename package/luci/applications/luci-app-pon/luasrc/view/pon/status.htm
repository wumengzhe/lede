<%+header%>

<h2 name="content"><%:PON status%></h2>

<div id="pon-status" class="cbi-map">
	<div class="cbi-map-descr">
		<%:XG/XGS-PON optical network terminal status — auto-refreshing every 2 s.%>
	</div>
	<fieldset class="cbi-section">
		<legend><%:Line%></legend>
		<div class="cbi-section-node">
			<table class="cbi-section-table" id="pon-tbl">
				<tr class="cbi-section-table-titles">
					<th class="cbi-section-table-cell"><%:Item%></th>
					<th class="cbi-section-table-cell"><%:Value%></th>
				</tr>
			</table>
		</div>
	</fieldset>
	<fieldset class="cbi-section">
		<legend><%:Control%></legend>
		<div class="cbi-page-actions">
			<form method="post" action="<%=url('admin/network/pon/activate')%>" style="display:inline">
				<input class="cbi-button cbi-button-apply" type="submit" value="<%:Activate%>" />
			</form>
			<form method="post" action="<%=url('admin/network/pon/deactivate')%>" style="display:inline">
				<input class="cbi-button cbi-button-reset" type="submit" value="<%:Deactivate%>" />
			</form>
			<a class="cbi-button" href="<%=url('admin/network/pon')%>"><%:Configure%></a>
			<a class="cbi-button" href="<%=url('admin/network/pon/diag')%>"><%:Diagnostics%></a>
		</div>
	</fieldset>
</div>

<script type="text/javascript">
(function() {
	var tbl = document.getElementById('pon-tbl');
	var url = '<%=url("admin/status/pon/json")%>';
	var rows = [
		['onu_state',       '<%:ONU state%>'],
		['state',           '<%:State code%>'],
		['mode_cfg',        '<%:Mode (configured)%>'],
		['mode_drv',        '<%:Mode (driver)%>'],
		['los_detection',   '<%:Optical signal%>'],
		['los',             '<%:LOS%>'],
		['fec',             '<%:FEC%>'],
		['laser',           '<%:Laser%>'],
		['rx_power',        '<%:RX power (dBm)%>'],
		['tx_power',        '<%:TX power (dBm)%>'],
		['temperature',     '<%:Temperature (°C)%>'],
		['bias',            '<%:Bias current (mA)%>'],
		['voltage',         '<%:Voltage (mV)%>'],
		['tx_fault',        '<%:TX fault%>'],
		['phy_ready',       '<%:PHY ready%>'],
		['xgtc_sync',       '<%:XGTC state%>'],
		['data_path_ok',    '<%:Kernel data path%>'],
		['service_ok',      '<%:Service ready%>'],
		['burst_ok',        '<%:Uplink burst%>'],
		['operstate',       '<%:netdev operstate%>'],
		['carrier',         '<%:netdev carrier%>'],
		['ponmgr',          '<%:ponmgr%>'],
		['omcid',           '<%:airoha-omcid%>'],
		['omcid2',          '<%:omcid2%>'],
	];

	function refresh() {
		var x = new XMLHttpRequest();
		x.open('GET', url, true);
		x.onreadystatechange = function() {
			if (x.readyState === 4 && x.status === 200) {
				try {
					var d = JSON.parse(x.responseText);
					while (tbl.rows.length > 1) tbl.deleteRow(1);
					for (var i = 0; i < rows.length; i++) {
						var k = rows[i][0];
						var v = (d[k] === undefined || d[k] === null) ? '?' : d[k];
						var r = tbl.insertRow(-1);
						var c1 = r.insertCell(0);
						var c2 = r.insertCell(1);
						c1.className = 'cbi-section-table-cell';
						c2.className = 'cbi-section-table-cell';
						c1.textContent = rows[i][1];
						c2.textContent = v;
					}
					var ts = tbl.insertRow(-1);
					var c1 = ts.insertCell(0);
					var c2 = ts.insertCell(1);
					c1.className = 'cbi-section-table-cell';
					c2.className = 'cbi-section-table-cell';
					c1.textContent = 'updated (epoch)';
					c2.textContent = d.now || '?';
				} catch (e) { /* swallow, retry next tick */ }
			}
		};
		x.send();
	}

	refresh();
	setInterval(refresh, 2000);
})();
</script>

<%+footer%>
