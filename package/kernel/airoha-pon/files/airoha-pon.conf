# kmod-airoha-pon module options. See the driver source header for the full
# rationale (package/kernel/airoha-pon/src/airoha_pon.c).
#
# hal_backend
#   1 = real  Drive the actual hardware: replay the reverse-engineered PON MAC
#             init sequence and ship OMCI frames to the on-die NPU XPON-HAL
#             firmware over the NPU mailbox. This is the mode an ONT needs in
#             order to talk to an OLT, which is why it is the default on this
#             board - the box exists to be a PON ONT.
#   0 = sim   Synthesise an O1..O5 bring-up and echo OMCI back. Use this to
#             exercise ponmgr / luci-app-pon without the proprietary XPON
#             firmware, or to get the unit up if that blob is missing.
#
# xpon_func_id
#   NPU mailbox function id the XPON-HAL answers on. Airoha does not publish
#   it, so -1 (default) discovers it at runtime on the first OMCI transmission
#   (worst case ~1.4 s, once). Read the result back from
#     /sys/module/airoha_pon/parameters/xpon_func_id_active
#   and pin it here (e.g. xpon_func_id=3) to skip probing on later boots.
#
options airoha_pon hal_backend=1 xpon_func_id=-1
