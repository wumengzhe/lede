# kmod-airoha-pon module options. See the driver source header for the full
# rationale (package/kernel/airoha-pon/src/airoha_pon.c).
#
# hal_backend
#   1 = real  Program the actual hardware: replay the reverse-engineered PON
#             MAC init sequence (pon_mac_seq.h) and drive the BOSA laser /
#             status GPIOs. The OMCI frame register protocol (QDMA TX path of
#             the stock xpon.ko) is the remaining open RE item, so OMCI
#             transmission reports -EOPNOTSUPP on this path until ported.
#             This is the mode an ONT ultimately needs in order to talk to
#             an OLT.
#   0 = sim   Synthesise an O1..O5 bring-up and echo OMCI back. Use this to
#             exercise ponmgr / luci-app-pon end-to-end while the optical
#             path is not yet working.
#
# NOTE: the optical link is terminated by the on-die PON MAC/XPON PHY
# (0x1fa80000), NOT by the NPU - the stock npu.ko is a WiFi/PPE offload
# firmware loader and the on-die NPU carries no XPON HAL (see
# Tools/re_notes_omci_mailbox.md, rev 2).
#
options airoha_pon hal_backend=1
